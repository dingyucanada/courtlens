name: Product checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: Install image renderer
        run: python -m pip install -r requirements-media.txt
      - name: Product tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser logic tests
        run: node --test tests/*.test.cjs site/logic.test.mjs
      - name: Public artifact and evidence tests
        run: python tools/test_site.py
